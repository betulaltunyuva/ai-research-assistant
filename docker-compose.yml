services:

  api:
    build: .
    container_name: ai-research-api

    command:
      - uvicorn
      - api:api
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434

    volumes:
      - ./documents:/app/documents
      - ./outputs:/app/outputs

    restart: unless-stopped


  web:
    build: .
    container_name: ai-research-web

    command:
      - streamlit
      - run
      - web_app.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"

    ports:
      - "8501:8501"

    env_file:
      - .env

    environment:
      API_URL: http://api:8000

    volumes:
      - ./documents:/app/documents
      - ./outputs:/app/outputs

    depends_on:
      - api

    restart: unless-stopped